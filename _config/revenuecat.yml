---
Name: revenuecat
After: '#restful-framework-routes'
---
SilverStripe\Control\Director:
  rules:
    'api/v1/webhooks/revenuecat': BradTipper\RestfulFramework\Account\RevenueCatWebhookController

SilverStripe\Security\Member:
  extensions:
    - BradTipper\RestfulFramework\Admin\MemberBillingExtension

BradTipper\RestfulFramework\Account\RevenueCatWebhookController:
  environment: PRODUCTION
  entitlement_ids:
    - pro
  product_ids: []
---
Name: revenuecat-service-desk
Only:
  classexists: 'BradTipper\RestfulFramework\Admin\SupportAdmin'
---
# Show the subscription events next to contact messages and feedback when the service desk is installed.
BradTipper\RestfulFramework\Admin\SupportAdmin:
  managed_models:
    - BradTipper\RestfulFramework\Model\RevenueCatEvent
